# Architecture rules for FsAnalyser, read by the engine's Fitness check (op=check, op=rules).
#
# TWIN OF tests/FsAnalyser.Core.Tests/ArchitectureRulesTests.cs. That file is the source: every
# pattern, scope and exemption here is copied from one of its [Fact]s, and the reasons from
# docs/design/SL-020-scanner.md (Architecture rules). Change a rule in both places, or in neither.
#
# One entry per ([Fact], scope glob) pair, because `files` takes a single glob with no braces or
# alternation. A [Fact] whose files span two file types or two roots is split into two entries that
# are identical except for `name` and `files`; each carries the [Fact]'s whole except_files list.
# The name is the [Fact]'s method name with the scope in parentheses, so a violation here points at
# the xUnit test that fails with it. Five rules, eight entries.
#
# ArchitectureRulesTests (xUnit) is the authority. These rules are a quicker copy of it that the
# engine can run at every gate, and they can pass where xUnit fails. Known differences, given as
# examples and not as a complete list:
#   - A match that spans a line break. Fitness matches whole-file text and xUnit one line at a time,
#     so \s, [^)]* and [^>]* can cross a line break here and not there: `using` and `System.Windows;`
#     on two lines fail here and pass xUnit. A (?m)^\s* match is also reported at the first of any
#     blank lines before the offending line, so the line number can differ.
#   - A file that is not UTF-8, such as UTF-16 or UTF-32. Fitness decodes every file as UTF-8 with
#     errors replaced, so no pattern here matches it; xUnit decodes it by its byte-order mark and
#     fails it.
#   - A file over 2 MB, which Fitness skips unread.
#   - A file under a folder the engine skips by name at any depth (SKIP_DIRS in taad3/fitness.py):
#     packages/, dist/, target/, node_modules/, venv/, .venv/, .vs/, .idea/, .next/, __pycache__/,
#     .git/ and more, besides bin/ and obj/. xUnit skips only bin/ and obj/.
#   - Upper and lower case in an exempted file's name. Fitness's except_files ignore case and xUnit's
#     .Except([...]) does not, so a case-only rename of an exempted file such as EntryClassifier.cs
#     or TestNative.cs fails xUnit and passes here.
# No pattern in this repo can close the last four; the fixes belong in the engine. Until then the
# xUnit test is the backstop.
#
# AUTHORING RULES, for anyone editing or appending (by hand or through a design's architecture_rules).
# Each one exists because breaking it makes a rule pass silently:
#   - Every pattern starts with (?m). Fitness matches the whole file text without MULTILINE, so a bare
#     ^ only fires on a file's first line. The xUnit test compiles with RegexOptions.Multiline; any
#     other RegexOptions it uses is carried the same way, as an inline flag at the pattern start.
#   - Every ^ anchor is followed by \ufeff? (an optional byte-order mark, written as that escape, never
#     as the invisible character). Fitness keeps a UTF-8 BOM as the first character of line 1 and \s
#     does not match it, while xUnit's File.ReadAllLines strips it, so without this a line-1 hit in a
#     BOM file passes here and fails there.
#   - Every entry says including_comments: true. Fitness blanks // and /* */ in .cs by default, and
#     the xUnit test matches raw lines, comments included. The engine's append of a design's declared
#     rules writes neither this flag nor (?m), so a declared rule must put (?m) in its own pattern.
#   - Every regex is a YAML single-quoted scalar ('' for a quote). Double quotes turn \b into a
#     backspace and reject \s.
#   - Every `files` glob is rooted at src/ or tests/. A bare **/*.cs also reads the gitignored .dotnet/,
#     artifacts/ and TestResults/, which Fitness does not prune (it prunes only a fixed list of
#     directory names, such as bin/, obj/ and packages/).
#   - A glob must match at least one file. op=check lists any rule that MATCHED NO FILES; that list
#     must stay empty.
#   - `rules:` stays the only top-level key and the last thing in the file, with entries indented two
#     spaces, because the engine appends new entries to the end of the file at that indent.
rules:
  - name: 'TheScannerCoreDoesNotKnowAboutTheScreen (*.cs)'
    files: 'src/FsAnalyser.Core/**/*.cs'
    must_not_match:
      - '(?m)^\ufeff?\s*using\s+(static\s+)?(System\.Windows|PresentationFramework|FsAnalyser\.App)'
      - '(?m)<UseWPF>\s*true'
      - '(?m)<UseWindowsForms>\s*true'
      - '(?m)<ProjectReference[^>]*FsAnalyser\.App'
    including_comments: true
    because: 'The scanner core does not know about the screen (docs/design/SL-020-scanner.md, Architecture rules).'

  - name: 'TheScannerCoreDoesNotKnowAboutTheScreen (*.csproj)'
    files: 'src/FsAnalyser.Core/**/*.csproj'
    must_not_match:
      - '(?m)^\ufeff?\s*using\s+(static\s+)?(System\.Windows|PresentationFramework|FsAnalyser\.App)'
      - '(?m)<UseWPF>\s*true'
      - '(?m)<UseWindowsForms>\s*true'
      - '(?m)<ProjectReference[^>]*FsAnalyser\.App'
    including_comments: true
    because: 'The scanner core does not know about the screen (docs/design/SL-020-scanner.md, Architecture rules).'

  - name: 'OnlyTheClassifierReadsTheReparseAttribute (*.cs)'
    files: 'src/**/*.cs'
    except_files:
      - 'src/FsAnalyser.Core/Scanning/EntryClassifier.cs'
      - 'src/FsAnalyser.Core/Native/Kernel32.cs'
    must_not_match:
      - '(?m)FileAttributes\.ReparsePoint'
      - '(?m)FILE_ATTRIBUTE_REPARSE_POINT'
      - '(?m)IsReparsePoint'
      - '(?m)0x0*400\b'
    including_comments: true
    because: 'Only the classifier reads the reparse attribute (widened to all of src, O-006). Deciding link-or-data by the reparse attribute dropped 241.7 MiB and the OneDrive tree in the spike, and the store exposes Attributes to every later reader.'

  - name: 'OnlyTheClassifierReadsTheReparseAttribute (*.xaml)'
    files: 'src/**/*.xaml'
    except_files:
      - 'src/FsAnalyser.Core/Scanning/EntryClassifier.cs'
      - 'src/FsAnalyser.Core/Native/Kernel32.cs'
    must_not_match:
      - '(?m)FileAttributes\.ReparsePoint'
      - '(?m)FILE_ATTRIBUTE_REPARSE_POINT'
      - '(?m)IsReparsePoint'
      - '(?m)0x0*400\b'
    including_comments: true
    because: 'Only the classifier reads the reparse attribute (widened to all of src, O-006). Deciding link-or-data by the reparse attribute dropped 241.7 MiB and the OneDrive tree in the spike, and the store exposes Attributes to every later reader.'

  - name: 'TheScannerListsDirectoriesOnlyThroughDirectoryReader (*.cs)'
    files: 'src/FsAnalyser.Core/Scanning/**/*.cs'
    must_not_match:
      - '(?m)Directory\.(Enumerate\w*|GetFiles|GetDirectories|GetFileSystemEntries)'
      - '(?m)new\s+(DirectoryInfo|FileInfo)\b'
      - '(?m)FileSystemEnumerable'
      - '(?m)EnumerationOptions'
      - '(?m)AttributesToSkip'
    including_comments: true
    because: 'The scanner lists directories only through DirectoryReader (docs/design/SL-020-scanner.md, Architecture rules).'

  - name: 'CountingRuleTestsAreNeverSkipped (*.cs)'
    files: 'tests/FsAnalyser.Core.Tests/**/*.cs'
    must_not_match:
      - '(?m)\[(Fact|Theory)\([^)]*\bSkip\w*\s*='
      - '(?m)Assert\.Skip\w*\('
      - '(?m)Skip\.(If|IfNot|Unless)'
      - '(?m)\bExplicit\s*=\s*true'
      - '(?m)Skip(?:Exception)'
    including_comments: true
    because: 'Counting-rule tests are never skipped (extended, O-007): the counting rules are the one place not to cut corners. Covers xUnit v2 and v3: Skip properties, dynamic skips, and v3''s explicit-only tests.'

  - name: 'InteropLivesOnlyInNative (src)'
    files: 'src/**/*.cs'
    except_files:
      - 'src/FsAnalyser.Core/Native/**'
      - 'tests/FsAnalyser.Core.Tests/TestNative.cs'
    must_not_match:
      - '(?m)(Library|Dll)Import'
    including_comments: true
    because: 'Interop lives only in Native (O-003). Every Win32 call goes through Native, where paths are \\?\ and built by LongPath. Fixture-only interop lives in TestNative.cs.'

  - name: 'InteropLivesOnlyInNative (tests)'
    files: 'tests/**/*.cs'
    except_files:
      - 'src/FsAnalyser.Core/Native/**'
      - 'tests/FsAnalyser.Core.Tests/TestNative.cs'
    must_not_match:
      - '(?m)(Library|Dll)Import'
    including_comments: true
    because: 'Interop lives only in Native (O-003). Every Win32 call goes through Native, where paths are \\?\ and built by LongPath. Fixture-only interop lives in TestNative.cs.'
