# Architecture rules for FsAnalyser, read by the engine's Fitness check (op=check, op=rules).
#
# Two kinds of entry:
#   - TWINNED: every entry above the first '# settled by SL-0xx' marker. Each is a TWIN OF a [Fact] in
#     tests/FsAnalyser.Core.Tests/ArchitectureRulesTests.cs. That file is the source: every pattern,
#     scope and exemption is copied from one of its [Fact]s, and the reasons from
#     docs/design/SL-020-scanner.md (Architecture rules). Change a rule in both places, or in neither.
#     eng/rules-parity.ps1 checks that the two copies hold the same patterns, and RuleCopiesAgreeTests
#     runs it on every `dotnet test`, so a pattern changed in one place only fails a test. It reads only
#     single-quoted patterns that start with (?m), allows the BOM guard (authoring rules below), and
#     stops at the first '# settled by' line: a twinned entry goes above it, and one there with no
#     [Fact] is drift. It compares patterns, not scopes, exemptions or engine behaviour, so after
#     changing a rule also run eng/rules-harness/harness.py (it needs the TAAD engine), which plants
#     violations in a scratch copy and checks what each engine does with them.
#   - SETTLED: every entry under a '# settled by SL-0xx' marker, appended by the engine from that
#     slice's design (architecture_rules). It has NO xUnit twin: Fitness is its only enforcement, and
#     `dotnet test` stays green when it breaks. Its reason is its `because`. Change it here only.
#
# For twinned entries: one entry per ([Fact], scope glob) pair, because `files` takes a single glob
# with no braces or alternation. A [Fact] whose files span two file types or two roots is split into
# two entries that are identical except for `name` and `files`; each carries the [Fact]'s whole
# except_files list. The name is the [Fact]'s method name with the scope in parentheses, so a
# violation here points at the xUnit test that fails with it.
#
# For twinned entries, ArchitectureRulesTests (xUnit) is the authority. They are a quicker copy of it
# that the engine can run at every gate, and they can pass where xUnit fails. Known differences, given
# as examples and not as a complete list. Each D-id is a row of eng/rules-harness/divergences.json, which
# fails when both engines come to agree on it; delete the row and its D-id here together.
#   - A match that spans a line break (D5, D12). Fitness matches whole-file text and xUnit one line at
#     a time, so \s, [^)]* and [^>]* can cross a line break here and not there: `using` and
#     `System.Windows;` on two lines fail here and pass xUnit (D5). A (?m)^\s* match is also reported
#     at the first of any blank lines before the offending line, so the line number can differ (D12).
#   - A file that is not UTF-8, such as UTF-16 or UTF-32 (D6, D11). Fitness decodes every file as
#     UTF-8 with errors replaced, so no pattern here matches it; xUnit decodes it by its byte-order
#     mark and fails it. A single-byte file such as cp1252 is not one of these: both read it as UTF-8
#     with the odd byte replaced, and both fail an ASCII violation in it (D13, pinned, not a divergence).
#   - A file over 2 MB, which Fitness skips unread (D7, D10).
#   - A file under a folder the engine skips by name at any depth (SKIP_DIRS in taad3/fitness.py):
#     packages/ (D1), dist/ (D2), target/ (D8), node_modules/, venv/, .venv/, .vs/, .idea/, .next/,
#     __pycache__/, .git/ and more, besides bin/ and obj/. xUnit skips only bin/ and obj/.
#   - Upper and lower case in an exempted file's name (D3, D4, D9). Fitness's except_files ignore case
#     and xUnit's .Except([...]) does not, so a case-only rename of an exempted file such as
#     EntryClassifier.cs or TestNative.cs fails xUnit and passes here.
# No pattern in this repo can close the last four; the fixes belong in the engine. Until then the
# xUnit test is the backstop for twinned entries. Settled entries have none: a file that is not
# UTF-8, is over 2 MB or sits under a skipped folder hides a violation of theirs from every check.
#
# AUTHORING RULES, for anyone editing or appending (by hand or through a design's architecture_rules).
# Each one exists because breaking it makes a rule pass silently:
#   - Every pattern starts with (?m). Fitness matches the whole file text without MULTILINE, so a bare
#     ^ only fires on a file's first line. The xUnit test compiles with RegexOptions.Multiline; any
#     other RegexOptions it uses is carried the same way, as an inline flag at the pattern start.
#   - Every ^ anchor is followed by \ufeff? (an optional byte-order mark, written as that escape, never
#     as the invisible character). Fitness keeps a UTF-8 BOM as the first character of line 1 and \s
#     does not match it, while xUnit's File.ReadAllLines strips it, so without this a line-1 hit in a
#     BOM file passes here and fails there.
#   - Every twinned entry says including_comments: true. Fitness blanks // and /* */ in .cs by
#     default, and the xUnit test matches raw lines, comments included. The engine's append of a
#     design's declared rules writes neither this flag nor (?m), so a declared rule must put (?m) in
#     its own pattern, and a settled entry without the flag is matched against code only.
#   - Every regex written by hand is a YAML single-quoted scalar ('' for a quote). Double quotes turn
#     \b into a backspace and reject \s. The SL-023 entries are plain scalars as the engine appended
#     them; a plain scalar also keeps every backslash literal.
#   - Every `files` glob is rooted at src/ or tests/. A bare **/*.cs also reads the gitignored .dotnet/,
#     artifacts/ and TestResults/, which Fitness does not prune (it prunes only a fixed list of
#     directory names, such as bin/, obj/ and packages/).
#   - A glob must match at least one file. op=check lists any rule that MATCHED NO FILES; that list
#     must stay empty.
#   - `rules:` stays the only top-level key and the last thing in the file, with entries indented two
#     spaces, because the engine appends new entries to the end of the file at that indent.
rules:
  - name: 'TheScannerCoreDoesNotKnowAboutTheScreen (*.cs)'
    files: 'src/FsAnalyser.Core/**/*.cs'
    must_not_match:
      - '(?m)^\ufeff?\s*using\s+(static\s+)?(System\.Windows|PresentationFramework|FsAnalyser\.App)'
      - '(?m)<UseWPF>\s*true'
      - '(?m)<UseWindowsForms>\s*true'
      - '(?m)<ProjectReference[^>]*FsAnalyser\.App'
    including_comments: true
    because: 'The scanner core does not know about the screen (docs/design/SL-020-scanner.md, Architecture rules).'

  - name: 'TheScannerCoreDoesNotKnowAboutTheScreen (*.csproj)'
    files: 'src/FsAnalyser.Core/**/*.csproj'
    must_not_match:
      - '(?m)^\ufeff?\s*using\s+(static\s+)?(System\.Windows|PresentationFramework|FsAnalyser\.App)'
      - '(?m)<UseWPF>\s*true'
      - '(?m)<UseWindowsForms>\s*true'
      - '(?m)<ProjectReference[^>]*FsAnalyser\.App'
    including_comments: true
    because: 'The scanner core does not know about the screen (docs/design/SL-020-scanner.md, Architecture rules).'

  - name: 'OnlyTheClassifierReadsTheReparseAttribute (*.cs)'
    files: 'src/**/*.cs'
    except_files:
      - 'src/FsAnalyser.Core/Scanning/EntryClassifier.cs'
      - 'src/FsAnalyser.Core/Native/Kernel32.cs'
    must_not_match:
      - '(?m)FileAttributes\.ReparsePoint'
      - '(?m)FILE_ATTRIBUTE_REPARSE_POINT'
      - '(?m)IsReparsePoint'
      - '(?m)0x0*400\b'
    including_comments: true
    because: 'Only the classifier reads the reparse attribute (widened to all of src, O-006). Deciding link-or-data by the reparse attribute dropped 241.7 MiB and the OneDrive tree in the spike, and the store exposes Attributes to every later reader.'

  - name: 'OnlyTheClassifierReadsTheReparseAttribute (*.xaml)'
    files: 'src/**/*.xaml'
    except_files:
      - 'src/FsAnalyser.Core/Scanning/EntryClassifier.cs'
      - 'src/FsAnalyser.Core/Native/Kernel32.cs'
    must_not_match:
      - '(?m)FileAttributes\.ReparsePoint'
      - '(?m)FILE_ATTRIBUTE_REPARSE_POINT'
      - '(?m)IsReparsePoint'
      - '(?m)0x0*400\b'
    including_comments: true
    because: 'Only the classifier reads the reparse attribute (widened to all of src, O-006). Deciding link-or-data by the reparse attribute dropped 241.7 MiB and the OneDrive tree in the spike, and the store exposes Attributes to every later reader.'

  - name: 'TheScannerListsDirectoriesOnlyThroughDirectoryReader (*.cs)'
    files: 'src/FsAnalyser.Core/Scanning/**/*.cs'
    must_not_match:
      - '(?m)Directory\.(Enumerate\w*|GetFiles|GetDirectories|GetFileSystemEntries)'
      - '(?m)new\s+(DirectoryInfo|FileInfo)\b'
      - '(?m)FileSystemEnumerable'
      - '(?m)EnumerationOptions'
      - '(?m)AttributesToSkip'
    including_comments: true
    because: 'The scanner lists directories only through DirectoryReader (docs/design/SL-020-scanner.md, Architecture rules).'

  - name: 'CountingRuleTestsAreNeverSkipped (*.cs)'
    files: 'tests/FsAnalyser.Core.Tests/**/*.cs'
    must_not_match:
      - '(?m)\[(Fact|Theory)\([^)]*\bSkip\w*\s*='
      - '(?m)Assert\.Skip\w*\('
      - '(?m)Skip\.(If|IfNot|Unless)'
      - '(?m)\bExplicit\s*=\s*true'
      - '(?m)Skip(?:Exception)'
    including_comments: true
    because: 'Counting-rule tests are never skipped (extended, O-007): the counting rules are the one place not to cut corners. Covers xUnit v2 and v3: Skip properties, dynamic skips, and v3''s explicit-only tests.'

  - name: 'InteropLivesOnlyInNative (src)'
    files: 'src/**/*.cs'
    except_files:
      - 'src/FsAnalyser.Core/Native/**'
      - 'tests/FsAnalyser.Core.Tests/TestNative.cs'
      - 'tests/FsAnalyser.Core.Tests/CloudPlaceholderTests.cs'
      - 'tests/CfProvider/**'
      - 'tests/HoldRig/**'
    must_not_match:
      - '(?m)(Library|Dll)Import'
    including_comments: true
    because: 'Interop lives only in Native (O-003). Every Win32 call goes through Native, where paths are \\?\ and built by LongPath. Fixture-only interop lives in TestNative.cs, and the opt-in cloud rig''s in its two files (SL-049): the Trait-gated CloudPlaceholderTests.cs, and the provider process under tests/CfProvider. The held-open rig under tests/HoldRig (SL-056) is a process of its own that observes metadata through handles, independent of Native on purpose.'

  - name: 'InteropLivesOnlyInNative (tests)'
    files: 'tests/**/*.cs'
    except_files:
      - 'src/FsAnalyser.Core/Native/**'
      - 'tests/FsAnalyser.Core.Tests/TestNative.cs'
      - 'tests/FsAnalyser.Core.Tests/CloudPlaceholderTests.cs'
      - 'tests/CfProvider/**'
      - 'tests/HoldRig/**'
    must_not_match:
      - '(?m)(Library|Dll)Import'
    including_comments: true
    because: 'Interop lives only in Native (O-003). Every Win32 call goes through Native, where paths are \\?\ and built by LongPath. Fixture-only interop lives in TestNative.cs, and the opt-in cloud rig''s in its two files (SL-049): the Trait-gated CloudPlaceholderTests.cs, and the provider process under tests/CfProvider. The held-open rig under tests/HoldRig (SL-056) is a process of its own that observes metadata through handles, independent of Native on purpose.'

  - name: 'FileSystemCallsGoThroughTheCancelGuard (*.cs)'
    files: 'src/**/*.cs'
    except_files:
      - 'src/FsAnalyser.Core/Native/Kernel32.cs'
      - 'src/FsAnalyser.Core/Scanning/SynchronousIoCancel.cs'
    must_not_match:
      - '(?m)\bKernel32\.(CreateFile|GetFileInformationByHandleEx)\s*\('
    including_comments: true
    because: 'Every Win32 filesystem call goes through SynchronousIoCancel (SL-024, M1), which brackets it so Cancel can interrupt it and discards its result once a cancel was issued. A call made anywhere else blocks with no way to cancel it, or passes a cancelled cloud listing (SUCCESS, nothing in it) off as an empty folder.'

  - name: 'TheAnalysisReadsOnlyChargedSizesAndOnlyFromTheStore (*.cs)'
    files: 'src/FsAnalyser.Core/Analysis/**/*.cs'
    must_not_match:
      - '(?m)\.(?:Size|OnDisk)\s*[\(\[]'
      - '(?m)(?<![\w.])(?:File|Directory|FileInfo|DirectoryInfo|DriveInfo)\.\w+|System\.IO\.(?:File|Directory)\b|new\s+(?:FileInfo|DirectoryInfo|DriveInfo|FileStream)\b'
    including_comments: true
    because: 'The analysis code reads sizes only as the store charged them, and only from the store (SL-040, declared by its design and twinned by its build, m6). The store''s raw Size and OnDisk skip the counting rules: a hardlink''s later names, links, and a duplicate''s stale size all charge or read wrongly, so a ranking built on them lists one file twice or shows a wrong size while the tests for that one function still pass. Asking the disk again bypasses the store''s measured values and costs minutes on a multi-million-entry drive. Comments are matched too, so a comment under Analysis/ must not name these calls. Outside Core the compiler holds the first half, because the raw accessors are internal (SL-040, M2).'

  - name: 'TheScannerMakesNoBclFileSystemCalls (*.cs)'
    files: 'src/FsAnalyser.Core/Scanning/**/*.cs'
    must_not_match:
      - '(?m)\b(File|Directory|DirectoryInfo|FileInfo|DriveInfo)\.'
    including_comments: true
    because: 'A BCL file-system call on the scan thread would block with no guard around it, and Cancel could not free it (SL-024, M1). Path is not covered: GetFullPath and GetPathRoot are lexical and do no I/O.'

  - name: 'TheClassifierListsNoLinkTags (*.cs)'
    files: 'src/FsAnalyser.Core/Scanning/EntryClassifier.cs'
    must_not_match:
      - '(?m)(?i)IO_REPARSE_TAG_(MOUNT_POINT|SYMLINK|DFS)\b|0x(A0000003|A000000C|8000000A)\b'
    including_comments: true
    because: 'A link is a reparse point whose tag has the name-surrogate bit (SL-043 criterion 4, U-004; declared by its design and twinned by its build). Listing tags again brings DFS back as a link, so its folders go unread, and makes every surrogate tag outside the list (WSL symlinks and others) a file or a folder that is charged or entered. Comments are matched too.'

  - name: 'NothingWaitsOnTheVolumeFigure (Core)'
    files: 'src/FsAnalyser.Core/**/*.cs'
    must_not_match:
      - '(?m)(?i)VolumeUsed\w*\.(Task\.)?(Wait|WaitAsync|GetAwaiter|Result)\b'
      - '(?m)(?i)\bawait\s+[\w.]*VolumeUsed'
    including_comments: true
    because: 'O-031: a volume that does not answer (a dead mapped drive) must not hold a scan, so nothing in Core waits on the used-space figure (SL-043, declared by its design and twinned by its build). The completion source the scan holds is named VolumeUsedSource, so a wait on it matches too (M2). A tripwire on names, not a proof: VolumeUsageTests is the behaviour.'

  - name: 'NothingWaitsOnTheVolumeFigure (App)'
    files: 'src/FsAnalyser.App/**/*.cs'
    must_not_match:
      - '(?m)(?i)VolumeUsed\w*\.(Task\.)?(Wait|WaitAsync|GetAwaiter|Result)\b'
      - '(?m)(?i)\bawait\s+[\w.]*VolumeUsed'
    including_comments: true
    because: 'The window does not wait on the used-space figure either (SL-043, M1): a wait or an await there holds the ending until the volume answers and keeps the scan''s store alive for as long as the read is stuck. The window applies the figure from a continuation that holds only the window and the scan''s generation.'

  - name: 'TheVolumeReadHoldsNoScanStore (*.cs)'
    files: 'src/FsAnalyser.Core/Scanning/VolumeSpace.cs'
    must_not_match:
      - '(?m)\bScanStore\b'
    including_comments: true
    because: 'The volume read runs on a thread a dead drive can park for good, so it is handed only the completion source it answers through (SL-043, declared by its design and twinned by its build). A read that named the store would keep a discarded scan (about 700 MiB at 5M entries, against about 136 MiB of headroom) alive for as long as it is stuck.'

  - name: 'PathOpensGoOnlyThroughTheGuardedOpen (*.cs)'
    files: 'src/FsAnalyser.Core/**/*.cs'
    except_files:
      - 'src/FsAnalyser.Core/Native/Kernel32.cs'
      - 'src/FsAnalyser.Core/Scanning/SynchronousIoCancel.cs'
    must_not_match:
      - '(?m)\b(CreateFile[AW2]?|CreateFileTransacted[AW]?|OpenFileById|(Nt|Zw)(Create|Open)File|(Nt|Zw)Query(Full)?AttributesFile|FindFirstFile(Ex)?[AW]?|FindFirstFileName[AW]?|FindFirstStream[AW]?|GetFileAttributes(Ex)?[AW]?|GetFileInformationByName|GetCompressedFileSize[AW]?|GetVolumeInformation[AW]?|GetDiskFreeSpace(Ex)?[AW]?)\s*\('
      - '(?m)"(CreateFile[AW2]?|CreateFileTransacted[AW]?|OpenFileById|(Nt|Zw)(Create|Open)File|(Nt|Zw)Query(Full)?AttributesFile|FindFirstFile(Ex)?[AW]?|FindFirstFileName[AW]?|FindFirstStream[AW]?|GetFileAttributes(Ex)?[AW]?|GetFileInformationByName|GetCompressedFileSize[AW]?|GetVolumeInformation[AW]?|GetDiskFreeSpace(Ex)?[AW]?)"'
    including_comments: true
    because: 'Every path Core opens is opened in SynchronousIoCancel.Open, inside the critical-error scope (SL-077, declared by its design and twinned by its build, widened to the named path-taking entry points by its review, m2, to their ANSI forms and entry-point names by its second review, R2-m2, and to GetCompressedFileSize, FindFirstFileName, FindFirstStream, GetFileInformationByName and CreateFileTransacted by its third, m1). It holds the entry points it names and no others: a path call by a name missing from the list passes it. A path call made anywhere else runs with the thread''s error mode as it found it, and on a removable drive with no media it raises the "insert a disk" box from that thread and holds the scan until a person answers. The first pattern is a call by the Win32 name; the second is that name as a string, which is how an import that renames the call (EntryPoint = "CreateFileW" on a method of another name) or a NativeLibrary.GetExport lookup names it. Of the two excepted files, the compiler holds SynchronousIoCancel.cs: its only path call is Kernel32.CreateFile, which takes the scope as an argument, and the imports behind it are private. The compiler does not hold Kernel32.cs, whose own members can call its private CreateFileW and GetDiskFreeSpaceEx with no scope: review holds it, and FailCriticalErrorsTests.Kernel32MakesOnlyThePathCallsThatRunInsideTheScope counts its calls of the named entry points with this rule''s own patterns, so a new one fails a test until somebody has read it. This rule holds every other file, including a new Native file with its own import. Comments are matched too.'

  - name: 'TheUnreadableViewTouchesNoFileSystem (*.cs)'
    files: 'src/FsAnalyser.App/UnreadableRows.cs'
    must_not_match:
      - '(?m)\b(File|Directory)\.\w+\s*\('
      - '(?m)\bnew\s+(FileInfo|DirectoryInfo|FileStream|DriveInfo|FileSystemWatcher)\b'
      - '(?m)\bSystem\.IO\b'
      - '(?m)\b(Kernel32|Scanner|DirectoryReader|SizeProbe)\.'
      - '(?m)\[\s*(Dll|Library)Import\b'
      - '(?m)\bPath\.Exists\b'
      - '(?m)\bnew\s+(StreamReader|StreamWriter)\b'
      - '(?m)\b(DriveInfo|RandomAccess|File(System)?Info)\.'
    including_comments: true
    because: 'The unreadable-folders list reads the scan''s record and never the filesystem (SL-087 Done-when #7, declared by its design and twinned by its build). A list that asked the disk about a folder again would describe the drive as it is now, not the scan it belongs to, and could hang on a dropped share or meet the same refusals on the UI thread. Windows'' message for a code, through Win32Exception, is the one lookup it makes, and no pattern here matches it. Directory.Build.props enables implicit usings, so System.IO is in scope with no token naming it: Path.Exists, the stream readers and the Info and RandomAccess types are named too (review m4). A tripwire on names: a call through a helper in another file, an alias or a global:: spelling passes it. Comments are matched too.'

  - name: 'TheAppNeverDecidesAFailedFolderKind (*.cs)'
    files: 'src/FsAnalyser.App/**/*.cs'
    must_not_match:
      - '(?m)(?<!\?)\?\s*UnreadableKind\.(NothingListed|ListedPartway)\b'
    including_comments: true
    because: 'The App never decides how much of a failed folder was listed (SL-087 Done-when #3, declared by its design and twinned by its build): the kind is the engine''s, read off its record, so the list cannot disagree with the engine about a folder. The compiler holds the rest: UnreadableFolder''s constructor is internal to Core and nothing on it can be set, so the App cannot make a record or copy one with another kind, and the declared pattern for a constructed record is dropped (review M3). This catches the kind chosen by a ternary, the shape a kind worked out again from a child count takes; a switch or an if/else passes it. The pattern holds on the ''?'' line alone, so the xUnit twin, which matches one line at a time, fails a ternary laid out over three lines as this repo writes them, as Fitness does (review R2-m1); ''??'' is not a ternary and is left out. Comments are matched too.'

  - name: 'NothingInTheAppHandsExplorerItsSelectSwitch (*.cs)'
    files: 'src/**/*.cs'
    must_not_match:
      - '(?m)/[Ss][Ee][Ll][Ee][Cc][Tt]\b'
    including_comments: true
    because: 'Nothing in the app hands Explorer its select switch (SL-088 criterion 3, declared by its design and twinned by its build). U-114 measured explorer.exe given the switch and a path of 300 or 1000 characters silently opening OneDrive\Documents, with exit code 1, no dialog and no HRESULT, so any launch with it, fallback or not, lands the person in the wrong folder with no signal. The reveal goes through SHParseDisplayName and SHOpenFolderAndSelectItems alone. SL-047''s settled pattern, the switch followed by a comma, misses the switch as its own argument (ArgumentList.Add), in upper case, and followed by a space and a quote; this one catches every spelling and case, and the word boundary leaves /selection and selected alone (plants F31-F35, P25-P27; SelectSwitchRuleTests). No file is exempt, ShellReveal.cs included. Comments are matched too, so a comment in src must call it Explorer''s select switch and not spell it.'

  - name: 'TheWindowReportReadsOnlyTheFailedFolderCount (*.cs)'
    files: 'src/FsAnalyser.App/**/WindowReport.cs'
    must_not_match:
      - '(?m)(?<!TopLevelState\.)\bUnreadable\b(?!\s*\??\.\s*Count\b)'
    including_comments: true
    because: 'The window report takes only the count from the scan''s failed-folder record (SL-089, declared by its design and twinned by its build). The record holds each failed folder''s entry, one step from its path, and Q-016 bars names and paths from the schema-1 report, which every window case reads and keeps as evidence: an element, an indexer, a foreach or a LINQ projection over the record is how a path would get in. The pattern names the record and allows it only followed by .Count, so it holds on one line: the record alone at the end of a line, the first line of the two-line fluent layout this file writes its LINQ in, fails the xUnit twin as it fails here (review M4). TopLevelState.Unreadable, a row state the report counts, is not the record. A tripwire on one route: another route to a path (the store, a list''s rows) is not fenced here (SC-133). Comments are matched too.'

  # settled by SL-023
  - name: the window report reads the window, never rebuilds it from Core
    files: src/FsAnalyser.App/WindowReport.cs
    must_not_match:
    - \bFormat[A-Z]\w*\s*\(|string\.Format\s*\(
    - \$"[^"]*\{[^}]*\.(Bytes|BytesOnDisk|Files|Folders|Links)\b
    - \.(Bytes|BytesOnDisk|Files|Folders|Links)\.ToString\(
    because: Validate trusts `window` as evidence of what the shipped window shows. If WindowReport
      calls a display helper or builds text from ScanResult, a wrong or blank control still
      reports correct numbers and the slice's evidence is worthless. The spike's broken-bytes-format
      proof does not repeat at validate, so this rule stands in for it.
  - name: the main window does not know it is being observed
    files: src/FsAnalyser.App/MainWindow.xaml.cs
    must_not_match:
    - \bWindowReport\b
    - \bif\s*\([^)]*[Rr]eport
    - \b[Rr]eport(Mode|Path)\b
    because: The report is only evidence about the normal window if rendering is identical with
      and without --report. If MainWindow references the report or branches on report mode,
      the observed window is no longer the one a person sees, and a normal launch could gain
      report behaviour without the App's report-mode guards (delete-first, exit codes). MainWindow
      raises EndingShown and nothing more.

  # settled by SL-024
  - name: CancelSynchronousIo is called only by the scan's own canceller
    files: src/**/*.cs
    must_not_match:
    - \bCancelSynchronousIo\s*\(
    because: 'CancelSynchronousIo can itself block (cited: it waits while on-access antivirus
      holds a CreateFile over a slow link). From the token callback or the App it runs on the
      UI thread inside _cancel.Cancel() and freezes the window, which is what this slice exists
      to prevent. From anywhere outside the Enter/Exit protocol it can also cancel an unrelated
      I/O on the scan thread.'
    except_files:
    - src/FsAnalyser.Core/Native/Kernel32.cs
    - src/FsAnalyser.Core/Scanning/SynchronousIoCancel.cs
  - name: the thread handle is never a pseudo-handle
    files: src/FsAnalyser.Core/**/*.cs
    must_not_match:
    - \bGetCurrentThread\b
    because: GetCurrentThread returns a pseudo-handle that always means the calling thread.
      Passed from the canceller it cancels the canceller's own I/O, so every cancel returns
      ERROR_NOT_FOUND, the scan never stops early, and nothing fails except a blocked-call test.
      The handle must come from OpenThread(THREAD_TERMINATE, GetCurrentThreadId()). \bGetCurrentThread\b
      does not match GetCurrentThreadId.

  # settled by SL-031
  - name: eng tooling carries no machine-specific path
    files: eng/**
    must_not_match:
    - '[A-Za-z]:\\+Users\\'
    - (?i)sl022-(fitness|val)
    because: 'The SL-022 harness crashed from a clean clone on exactly these: C:\Users\sshub\...
      constants and %TEMP%\sl022-* trees. A check pinned to one machine''s path cannot run in
      another worktree or checkout, and it fails silently as ''cannot measure''. Cite SL-022
      by id in notes, never by path. The two pre-existing scripts are excepted because this
      design does not govern them.'
    except_files:
    - eng/dotnet.ps1
    - eng/read-window.ps1
  - name: the .NET caller launches the check and parses nothing
    files: tests/FsAnalyser.Core.Tests/RuleCopiesAgreeTests.cs
    must_not_match:
    - \bRegex\b
    - YamlDotNet
    - File\.ReadAll(Text|Lines|Bytes)
    because: The slice's design rejected a rule parser inside the .NET project as over-built
      (C4). A third reader of the two rule copies would itself need keeping in step with them,
      which is the drift this slice exists to remove. The Fact may only launch eng/rules-parity.ps1
      and assert its exit code.
  - name: the harness measures the real Fitness engine and never a copy of it
    files: eng/rules-harness/*.py
    must_not_match:
    - (?m)^\s*(import|from)\s+yaml\b
    - \bSKIP_DIRS\b
    because: A reimplemented matcher or a private YAML reader pins the copy. The harness would
      stay green while the engine's glob, skip-dir, size or encoding behaviour changed, which
      is exactly the divergence class this slice measures. Only taad3.fitness may read fitness.yaml.

  # settled by SL-033
  - name: the shipped app carries no test seam
    files: src/**
    must_not_match:
    - FSA_HOOK_
    - FSA_T005_
    - DOTNET_STARTUP_HOOKS
    - \bStartupHook\b
    - FsaWindowHook
    - tests[\\/]window
    because: If the app read a hook mode or hosted the driver, C-006, C-012 and O-016 would
      measure a seam that ships, not the app. The hook must enter from outside through DOTNET_STARTUP_HOOKS
      only. SL-080 widened it to every FSA_HOOK_ and FSA_T005_ variable and to any path into tests/window
      (a ProjectReference in a src csproj included), because the batch driver, the traces and the stack
      reader observe the app from outside, and the app must behave under diagnosis as it does in the field.
  - name: the hook drives the app from outside and shares no code with it
    files: tests/window/FsaWindowHook/**
    must_not_match:
    - <ProjectReference
    - using\s+FsAnalyser\b
    because: A ProjectReference copies a second FsAnalyser.App.dll next to the hook, so the
      type it binds to is not the one bundled in the single-file exe. It would also couple the
      driver to app internals. The hook reaches the app only through Application.Current and
      FindName.
  - name: the hook never produces the outcome under test
    files: tests/window/FsaWindowHook/**/*.cs
    must_not_match:
    - Environment\.(Exit|FailFast)
    - \.Shutdown\s*\(
    - ExitCode\s*=
    because: 'C-012 and O-016 assert exit 70, which only the app''s own handlers may produce.
      A hook that exits or shuts down the process makes those cases unable to fail. The throw
      spike relied on exactly this: with the handler removed the exit was 0xE0434352, not 70.'

  # settled by SL-038
  - name: the stopping wording is a pure function of elapsed time
    files: src/FsAnalyser.App/StoppingWait.cs
    must_not_match:
    - '\b(?:System\.Windows|System\.IO|Microsoft\.Win32)\b'
    - '\bDriveInfo\b'
    - '\b(?:Directory|File)\.\w+\('
    - 'DateTime(Offset)?\.(Utc)?Now'
    - 'Stopwatch\.(StartNew|GetTimestamp)'
    - 'Environment\.TickCount'
    - 'DispatcherTimer'
    because: The file is compiled into Core.Tests as a linked source, and Core.Tests does not reference
      WPF. Reading a clock or a window inside it would make the 2 s and 90 s boundaries untestable, and
      the wording tests would need a window. It also runs on the UI thread at every 250 ms tick, which
      must never touch a drive or share that may be stalled (spike 3's invariant, which is why the UI
      stayed live through a 64 to 70 s stall), or the line that explains the hang would itself hang.
      The namespace ban is a content pattern, not must_not_import, because an import rule does not
      run where no code graph has been built. It was unenforced at fresh gates, and it stopped
      eng/rules-harness from measuring anything (exit 2, SL-038 build 2).
  - name: Cancel never abandons the scan thread
    files: src/FsAnalyser.App/**/*.cs
    must_not_match:
    - Task\.WhenAny\(
    - (?i)scan\w*\.WaitAsync\(
    - Task\.(Run|Factory\.StartNew)\([^;]*\)\s*\.WaitAsync\(
    because: Abandoning the wait frees the window but leaves the scan thread and its store alive,
      with late writes into memory that has a 1 GB budget and into counting state. That is option
      (a), and it needs the person's decision, a retention measurement and a late-write guard
      first. The volume-query wait, running.WaitAsync(token), is allowed and must not match.
      A name-based match is a tripwire, not a proof, and review still applies.
  - name: only the shared rig changes SMB client mappings (C#)
    files: tests/**/*.cs
    must_not_match:
    - New-SmbMapping
    - Remove-SmbMapping
    - New-SmbGlobalMapping
    - \bnet(\.exe)?\s+use\b
    - WNetAddConnection
    - WNetCancelConnection
    because: The Windows SMB client allows one TCP port per server name, so every rig on 127.0.0.1
      shares one slot. A second place that maps or removes shares bypasses RigLock and the strict
      sweep filter, and can delete another run's mapping or the person's own.
    except_files:
    - tests/FsAnalyser.Core.Tests/Rig/SmbRig.cs
  - name: only the shared rig changes SMB client mappings (PowerShell)
    files: tests/**/*.ps1
    must_not_match:
    - New-SmbMapping
    - Remove-SmbMapping
    - New-SmbGlobalMapping
    - \bnet(\.exe)?\s+use\b
    because: The same rule for scripts. A window case that maps a share directly skips RigLock
      and the sweep filter. Mapping goes through StallRig or the rig, which the case starts.
  - name: only the shared rig changes SMB client mappings (PowerShell, eng)
    files: eng/**/*.ps1
    must_not_match:
    - New-SmbMapping
    - Remove-SmbMapping
    - New-SmbGlobalMapping
    - \bnet(\.exe)?\s+use\b
    because: The same rule for eng/, where this repo keeps its PowerShell helpers (dotnet.ps1,
      read-window.ps1, rules-parity.ps1). An eng-level cleanup helper is a plausible home for a
      removal that bypasses RigLock and the sweep filter. One entry per root, because files takes
      one glob.

  # settled by SL-039
  - name: the window never touches the scan store
    files: src/FsAnalyser.App/**/*.cs
    must_not_match:
    - '\bScanStore\b'
    - '(?<!\bresult)\.Store\b'
    - '\bStore\s*:'
    because: 'Reading the live store from the UI thread was measured no-go twice: +12-18% scan
      time at 200k (28% at 5M) against a 15% limit, and a child larger than its parent in 20
      of 20 runs. Results reach the window only as immutable snapshots on ScanProgress.TopLevel
      and ScanResult.TopLevel. The tree slice that builds the ScanStore ordering fix and the
      rollup read path is the one that deletes this rule on purpose. Narrowed at build (SL-039
      m8): the ending reads result.Store after the scan has returned, when nothing writes it
      (MainWindow.xaml.cs, the unreadable list), so result.Store is allowed and any other .Store,
      a property pattern on Store, or the type name fails. Run against trunk before it was
      declared: the rule as first appended failed trunk on exactly that result.Store line, and
      this one passes trunk and the slice. A tripwire on names, not a proof. Narrowed again, not
      deleted, by SL-044, whose folder tree reads a store without a live read path: only the
      finished one, handed over by MainWindow as result.Store once Scan() has returned, and only
      in the FolderTree files (the session that holds it and the rows that read it). The rule
      below, that Core publishes no store before the scan ends, is what keeps a live one out of
      reach; any other App file still may not name the store.'
    except_files:
    - src/FsAnalyser.App/FolderTree*.cs
  - name: published snapshot types cannot be changed after they are built
    files: src/FsAnalyser.Core/TopLevelSnapshot.cs
    must_not_match:
    - '\bset\s*;'
    - '\bpublic\s+(?:List|Dictionary|HashSet|ObservableCollection)<'
    - '\bpublic\s+\w+\[\]\s+\w+'
    - '\bpublic\s+I(?:List|Collection|Dictionary|Set)<'
    - '\bpublic\s+(?!const\b|static\b|readonly\b|override\b|abstract\b|sealed\b|class\b|record\b|enum\b|struct\b|interface\b)[\w.<>\[\],?]+\s+\w+\s*[;=](?!>)'
    because: 'The snapshot is handed to the UI thread with a plain reference publish and no lock.
      A setter, a public mutable field or a public mutable collection lets the scanner or the UI
      change an object the other is reading, which shows as a torn row or a list that no longer
      adds up. The last pattern is a public field (a type, a name, then ; or =), with (?!>) so an
      expression-bodied property does not match (SL-039 M3). Aliasing is not a pattern: the
      TopLevelSnapshot constructor copies the rows it is given and exposes them through
      Array.AsReadOnly, which cannot be cast back to an array, and TopLevelTests pins it.'
  - name: the tracker is owned by the scanner thread and takes no lock
    files: src/FsAnalyser.Core/TopLevelTracker.cs
    must_not_match:
    - \block\s*\(
    - \bMonitor\.(?:Enter|TryEnter)
    - \b(?:Semaphore\w*|Mutex|ReaderWriterLock\w*)\b
    - \bnew\s+Thread\s*\(|\bTask\.(?:Run|Factory)|\bThreadPool\.
    - \bConcurrent\w+<
    because: Its accumulators are plain fields written only by the scanner's thread. Letting
      another thread reach them is a torn read; guarding them with a lock makes the scanner
      wait on that lock, the exact cost that pushed spike 1 over its 15% limit.

  # settled by SL-042
  - name: the Scanner does not register file IDs or set the duplicate flag; the store does
    files: src/FsAnalyser.Core/Scanning/**/*.cs
    must_not_match:
    - \bTryAddFileId\s*\(
    - \|=\s*EntryFlags\.HardlinkDuplicate
    because: The store applies first-seen dedup inside append. If the Scanner registers the
      ID too, the first name finds its own ID already present, is flagged a duplicate and its
      bytes are charged nowhere. Every folder total under it is silently low, and the whole
      suite can stay green if only synthetic tests run.
  - name: the store does not know about the Scanner
    files: src/FsAnalyser.Core/Store/**/*.cs
    must_not_match:
    - \b(Scanner|DirectoryReader|SizeProbe|TopLevelTracker)\b
    because: The counting rule lives in the store so criteria 1-6 can be proved on synthetic
      entry streams with no disk. A store that reaches back into the Scanner makes those tests
      need a real drive and lets a second copy of the rule grow in the Scanner.
  - name: the rollup and timing tests are never skipped or filtered out
    files: tests/FsAnalyser.Core.Tests/ScanStoreRollup*.cs
    must_not_match:
    - \bSkip\s*=
    - Assert\.Skip
    - Trait\(\s*"Network"
    because: The project's testing constraint says counting-rule tests are never skipped, and
      criterion 6 is a measured number. A skipped or default-filtered test reports green while
      proving nothing, which is the failure this slice's cases exist to prevent.

  # settled by SL-044
  - name: the folder tree shows Core's order and never re-sorts or mutates children item by
      item
    files: src/FsAnalyser.App/FolderTree*.cs
    must_not_match:
    - SortDescriptions
    - CollectionViewSource
    - \.OrderBy(Descending)?\(
    - \.Sort\(
    - \bChildren\.(Add|Insert|AddRange|Remove\w*)\(
    because: ChildrenLargestFirst owns the order (on-disk size, then entry order). A second
      sort in the window with another key, such as the bytes sort the flat list uses, silently
      disagrees with Core and with row 2. Per-item edits to Children raise one change notification
      per row, which cannot meet row 5 at 100,000 children. Children is replaced once, as a
      whole array.
  - name: Core does not publish a live ScanStore before the scan ends
    files: src/FsAnalyser.Core/**/*.cs
    must_not_match:
    - \bScanStore\b
    because: Rollups are posted while the scanner writes, and reading them from another thread
      is unsupported (SL-042 doc). The mid-scan-shares spike measured child above parent 10-21
      times per scan and children summing above the parent about 400 times. ScanResult.Store,
      set when Scan() returns, is the only sanctioned way to a store. A live tree needs a consistent
      read path first (immutable per-folder snapshots, or a seqlock or epoch), and whoever builds
      it must change this rule on purpose. An allow-list (SL-044 review m5), because a pattern for
      a public property misses a nullable one, a method, a record's positional parameter (on
      ScanProgress, which already carries TopLevel mid-scan) and an event. The store's own files,
      the Scanner that holds its private store, ScanResult, the tracker the Scanner seeds, and the
      analysis that reads a finished store name the type; any other Core file that does fails and
      must be justified here. Code only, not comments.
    except_files:
    - src/FsAnalyser.Core/Store/ScanStore*.cs
    - src/FsAnalyser.Core/Scanning/Scanner.cs
    - src/FsAnalyser.Core/Scanning/ScanResult.cs
    - src/FsAnalyser.Core/TopLevelTracker.cs
    - src/FsAnalyser.Core/Analysis/LargestFiles.cs
    # SL-046: the file-kind breakdown reads a returned store, as LargestFiles does.
    - src/FsAnalyser.Core/Analysis/KindBreakdown.cs
  - name: the window does not sort the folder tree in its XAML either
    files: src/FsAnalyser.App/*.xaml
    must_not_match:
    - SortDescriptions|CollectionViewSource|IsLiveSorting
    because: The folder tree lives and is wired in MainWindow.xaml and MainWindow.xaml.cs, outside
      the FolderTree files the rule above covers (SL-044 review m6). A CollectionViewSource or a
      sort description there re-sorts the rows under Core's order (ChildrenLargestFirst, on-disk
      size then entry order) and disagrees with row 2 without failing anything else. The flat
      list's bytes sort is done in code over an array (Array.Sort), not in a view, so it does
      not match.
  - name: the window does not sort the folder tree in its code either
    files: src/FsAnalyser.App/MainWindow.xaml.cs
    must_not_match:
    - SortDescriptions|CollectionViewSource|IsLiveSorting
    because: The same rule for the window's code, where FolderTree.Items.SortDescriptions would
      be the easy way to break it (SL-044 review m6). One entry per file type, because files
      takes one glob.

  # settled by SL-046
  - name: the breakdown reads the finished scan store and never the filesystem
    files: src/FsAnalyser.Core/Analysis/**
    must_not_match:
    - (?<![\w.])(?:File|Directory)\s*\.\s*[A-Z]\w*\s*\(
    - \bSystem\.IO\.(?:File|Directory)\b
    - \b(?:FileInfo|DirectoryInfo|FileStream|SafeFileHandle|NtCreateFile|CreateFile\w*)\b
    because: Analysis is a pure function of the finished store. Opening a file to sniff its
      type would pull OneDrive online-only files down and break the on-disk counting rule, and
      it would make the reconcile against the root rollup meaningless.
  - name: only Core classifies files into kinds; the App formats what Core returns
    files: src/FsAnalyser.App/**
    must_not_match:
    - Path\s*\.\s*GetExtension
    - \bFileKinds\b
    because: A second classifier in the App would drift from Core's table, so the panel and
      the --report kinds section would disagree and the end-to-end reconcile would be comparing
      against a different table.

  # settled by SL-047
  - name: Only ShellReveal.cs calls the shell's reveal APIs or explorer.exe /select
    files: src/**/*.cs
    must_not_match:
    - SHOpenFolderAndSelectItems
    - SHParseDisplayName
    - /select\s*,
    because: ShellReveal.Plan is the only place that knows which names the shell mis-parses.
      The odd-names spike showed SHParseDisplayName returning S_OK and Explorer selecting a
      decoy ('dup' for 'dup.') with no error. A second caller, or an explorer.exe /select command
      line, skips that check and ships a quiet wrong target. InteropLivesOnlyInNative only keeps
      P/Invoke inside Core/Native; it does not stop a second file in there from calling these
      APIs.
    except_files:
    - src/FsAnalyser.Core/Native/ShellReveal.cs
  - name: The window never blocks on the reveal
    files: src/FsAnalyser.App/**/*.cs
    must_not_match:
    - RevealAsync\([^;]*\)\s*\.(Result\b|Wait\(|GetAwaiter\(\)\s*\.GetResult\()
    because: SHParseDisplayName on an unreachable UNC share can block for tens of seconds. Waiting
      on the reveal Task from the UI thread freezes the window for that long. The reveal runs
      on its own STA thread and the handler must await it.

  # settled by SL-053
  - name: the rule-case suite never pins a literal settled-entry count
    files: tests/rules/RuleCases.ps1
    must_not_match:
    - \b\d+ settled entr(?:y|ies)
    because: Every slice that declares architecture_rules appends settled entries, so a pinned
      count goes stale on the next one. It went 28 to 32 with C-001 and C-003 already red, and
      SL-043 refreshed it by hand. No gate runs RuleCases (O-005), so this fitness rule is the
      only place a re-pin can fail visibly. The expected count must come from the Fitness rule
      count minus the twinned count.

  # settled by SL-049
  # Widened at build (SL-049 review M3, m2): cldapi and every cloud-files verb, not five names; the rig and the
  # provider by name; and the provider's own files may not name Core at all.
  - name: shipped code never registers, serves or hydrates through the cloud-files API
    files: src/**/*.cs
    must_not_match:
    - '(?i)cldapi'
    - '\bCf(Register|Unregister|Connect|Disconnect|Execute|Hydrate|Dehydrate|Create|Convert|Update|SetInSyncState)\w*'
    because: The app is a reader. Code that registers a sync root, answers callbacks or hydrates
      would download the person's online-only files and put a fake provider on their PC. The
      spike shipped-scan-hydrates-nothing measured 0 FETCH_DATA for the shipped scanner. The
      only sanctioned use of these calls is the opt-in test provider under tests/.
  - name: cloud-files calls in Core.Tests live only in the Trait-gated class
    files: tests/FsAnalyser.Core.Tests/**/*.cs
    must_not_match:
    - '(?i)cldapi'
    - '\bCf(Register|Unregister|Connect|Disconnect|Execute|Hydrate|Dehydrate|Create|Convert|Update|SetInSyncState)\w*'
    - 'CfProvider'
    - 'SyncRootRig'
    because: A cloud-files call, a start of the provider or a rig built in any other test file is not
      behind Cloud=CF-SYNC-ROOT. Every default run would then register a real sync root under the
      person's %TEMP%. The guard Fact only checks Traits that exist, so a file with no Trait would
      pass it. The rig is a private class of the Trait-gated class, so the compiler keeps other
      classes from building one; this keeps other files from starting the provider or calling
      cldapi themselves. The pure parts every file may use (CloudRig.cs, ScanDeadline.cs) name
      none of these. ArchitectureRulesTests.cs is excepted because InteropLivesOnlyInNative names
      the provider's folder, tests\CfProvider\, to exempt it; eng/rules-parity.ps1 holds every Fact
      there to one AssertNoMatch call, so none of them can start a provider. Review covers the rest
      of that file.
    except_files:
    - tests/FsAnalyser.Core.Tests/CloudPlaceholderTests.cs
    - tests/FsAnalyser.Core.Tests/ArchitectureRulesTests.cs
  - name: the provider does not use the code it checks
    files: tests/CfProvider/**
    must_not_import:
    - FsAnalyser.Core*
    must_not_match:
    - <ProjectReference
    - 'FsAnalyser\.Core'
    because: The provider is the independent source of declared sizes and callback behaviour.
      If it shared Core code, a counting or guard defect would sit on both sides of the assertion
      and the test would agree with the bug. The SL-024 harness it was lifted from reached Core
      through a HintPath Reference, which no ProjectReference or import rule sees, and a fully
      qualified name needs no import, so the name itself is refused in every file there.

  # settled by SL-055
  # Its design also declared 'Only the cancel guard issues CancelSynchronousIo'. That was SL-024's rule
  # above to the letter (same files, pattern and except_files), so its build dropped the copy (review m7).
  # SL-024's rule now also stands for this: a CancelSynchronousIo made outside the guard skips its gate and
  # drain, and can land after Exit on later I/O, listing a readable folder as unreadable (PS-006).
  - name: Cancel attempts never run on the thread pool or a timer
    files: src/FsAnalyser.Core/Scanning/SynchronousIoCancel.cs
    must_not_match:
    - \bThreadPool\.(?!UnsafeQueueUserWorkItem\(static aborted\b)
    - \bTask\.Run\s*\(
    - \bTask\.Factory\.StartNew\b
    - \bnew\s+Task\s*[(<]
    - \bQueueUserWorkItem\b
    - \bnew\s+(System\.Threading\.)?Timer\s*\(
    - \bSystem\.Timers\.Timer\b
    - \bPeriodicTimer\b
    because: A CancelSynchronousIo call held in the kernel would pin a pool thread the scanner
      shares, and slow pool thread injection under load would bring back the same lost resend
      this slice removes. Attempts need dedicated threads. One pool call is allowed, and only at
      its call site - Close's hand-off of an aborted call's handle, ThreadPool.UnsafeQueueUserWorkItem(static
      aborted => ...), which is on purpose (SL-024, review m3). The exemption is tied to that
      lambda's parameter, so reusing the same API to queue an attempt still fails (review
      R2-m1), as does a Task constructed and started by hand; \bQueueUserWorkItem\b does not
      match the Close call. Matched against code only, so a comment can say why without failing it.

  # settled by SL-056
  # As its design declared them, then changed at build by the review findings the person accepted: rule 1 names the
  # file the probes now live in (ProbePass.cs, list-then-probe, M-add-1) and every store write (M2); rule 2 fences every
  # timestamp setter, not one API name, and excepts the files the interop and cancel-guard rules put the one call in
  # (M8); rule 3 covers all of Scanning (m3); rule 4 is new (M8). None has an xUnit twin.
  - name: probe results are applied only on the listing thread, never inside a worker
    files: src/FsAnalyser.Core/Scanning/ProbePass.cs
    must_not_match:
    - '(?m)\.Correct\s*\('
    - '(?m)\.Credit\s*\('
    - '(?m)\bCorrectSizes\b'
    - '(?m)\bAddFlags\b'
    because: 'SL-042 measured 16-worker parallel attribution swinging folder totals by more than 10 MiB across 5
      runs (WinSxS by 587 MiB). The scan lists everything, then its workers probe a batch of paths and hand back
      readings, and the scan thread applies them once the batch''s workers have finished (review M-add-1). A worker
      gets nothing to apply with, ProbePass cannot name the store (the rule that Core publishes no live ScanStore),
      and Scanner''s Correct and Credit refuse any other thread through ThreadOwner (review M2). This rule is the
      tripwire under those: no store write is spelled where the workers run.'
  - name: only the directory-listing open path may write a file-system timestamp
    files: src/FsAnalyser.Core/**/*.cs
    must_not_match:
    - '(?m)\bSetFileInformationByHandle\b'
    - '(?m)\bSetFileTime\b'
    - '(?m)\bNtSetInformationFile\b'
    - '(?m)\bSetFileAttributes\w*'
    - '(?m)\b(File|Directory)\.Set(LastAccess|LastWrite|Creation)Time'
    - '(?m)\.(LastAccess|LastWrite|Creation)Time(Utc)?\s*=(?!=)'
    because: 'Criterion 6 forbids the scan changing any timestamp. The folder-atime-suspend-on-list-handle spike
      proved the one set the scanner makes, LastAccessTime -1 and 0 everywhere else on a listing handle, leaves a
      folder unchanged, but only while it is the one place that writes metadata: a second call site could set a
      wrong field and nobody would notice (review M8). So every way to write a time or an attribute is fenced, not
      one API name. The declaration lives in Native/Kernel32.cs (InteropLivesOnlyInNative) and the one call inside
      SynchronousIoCancel.OpenDirectory, the one function that hands out a listing handle, bracketed by the cancel
      guard (FileSystemCallsGoThroughTheCancelGuard); those two files are excepted, and review is what holds them.'
    except_files:
    - src/FsAnalyser.Core/Native/Kernel32.cs
    - src/FsAnalyser.Core/Scanning/SynchronousIoCancel.cs
  - name: the size probe's open stays on CreateFileW, not a parent-relative NtOpenFile
    files: src/FsAnalyser.Core/Scanning/*.cs
    must_not_match:
    - '(?m)\bNtOpenFile\b'
    because: 'SL-045 measured that a SYNCHRONIZE-deny ACE refuses CreateFileW''s implicit SYNCHRONIZE request but
      not a parent-relative NtOpenFile with FILE_READ_ATTRIBUTES only. Moving the probe''s open to NtOpenFile, the
      route U-014''s census used and the likely one for a drive-time optimisation in ProbePass.cs or SizeProbe.cs,
      turns criterion 5''s refusal test (OnDiskSizeTests, wof-denied.txt asserted ProbeFailed) red; the risk is
      that someone then "fixes" the fixture and the refusal case goes untested (review m3).'
  - name: only DirectoryReader lists a directory
    files: src/FsAnalyser.Core/**/*.cs
    must_not_match:
    - '(?m)\bFindFirstFile\w*'
    - '(?m)\bNtQueryDirectoryFile\w*'
    - '(?m)\bFile\w*Directory(Restart)?Info\b'
    - '(?m)\bDirectory\.(Enumerate\w*|GetFiles|GetDirectories|GetFileSystemEntries)\b'
    - '(?m)\.(EnumerateFiles|EnumerateDirectories|EnumerateFileSystemInfos|GetFileSystemInfos)\s*\('
    - '(?m)\bFileSystemEnumerable\b'
    because: 'A listing moves a folder''s last-access time unless its handle was given LastAccessTime -1 first
      (SL-045, and the folder-atime spike). DirectoryReader lists only through SynchronousIoCancel.OpenDirectory,
      which does that where the volume and the folder allow it. A second listing anywhere else in Core, a folder
      refresh or a child count, would move last-access times while HeldOpenTreeTests, which runs only the scan,
      stayed green (review M8). The directory-information classes of GetFileInformationByHandleEx are fenced by
      their names; Kernel32.cs declares them.'
    except_files:
    - src/FsAnalyser.Core/Scanning/DirectoryReader.cs
    - src/FsAnalyser.Core/Native/Kernel32.cs

  # settled by SL-059
  - name: RigLock's scope is not re-claimed as machine-wide in StallRig
    files: tests/window/StallRig/Program.cs
    must_not_match:
    - on this machine
    including_comments: true
    because: this exact phrase claiming machine-wide scope for RigLock was already flagged by
      SL-038's own final code review and stayed unfixed for a full slice; SmbRig.cs and SL-020-scanner.md
      were corrected in SL-038 build 2 while this file was not
  - name: RigLock's scope is not re-claimed as machine-wide in StalledShareTests
    files: tests/FsAnalyser.Core.Tests/StalledShareTests.cs
    must_not_match:
    - on this machine
    including_comments: true
    because: 'same drift as StallRig/Program.cs: SL-038''s code review named this exact file
      and line and it has stayed wrong since'
  - name: RigLock's scope is not re-claimed as machine-wide in the window test driver
    files: tests/window/WindowCases.ps1
    must_not_match:
    - '(?mi)\b(?:lock|serialised|serialized|RigLock|rig runs?)\b[^\n]*\b(?:on this machine|machine-wide)\b'
    - '(?mi)\b(?:on this machine|machine-wide)\b[^\n]*\b(?:lock|RigLock|rig runs?)\b'
    including_comments: true
    because: 'the comment at line 1333 described RigLock as a machine-wide lock; the rig only
      ever serialises runs inside one sign-in session. The claim lives in comments, so every SL-059
      entry says including_comments: true, without which Fitness blanks the comment and the rule
      can never fire. This one is narrowed to a lock, serialisation or rig run named on the same
      line, because the file also says "on this machine" about measurements that are true and stay
      (B-008''s title lengths, the 4 KiB clusters above the folder-tree cases), and the design
      leaves unrelated hits alone (SL-059 C-003).'

  # settled by SL-063
  # As its design declared them, then changed at build by the review findings the person accepted: the three
  # declared rules are replaced by these two (M3, m2, m3). The first fences every set of the flag, in an object
  # initializer as much as through a dot, and lets == and => through, which only read it: the converter's own
  # `when row.Revised =>` would otherwise break it. The second is structural rather than tied to the wording or
  # to one file, so it covers a copy of the suffix and the report alike; a later slice that reports the flag
  # widens its except list on purpose. Neither has an xUnit twin; comments are not matched.
  - name: only the tracker sets a top-level row's Revised flag
    files: src/FsAnalyser.*/**/*.cs
    must_not_match:
    - '\bRevised\s*=(?![=>])'
    because: 'The tracker derives the flag where it builds a row, from the figures the row had when its
      pending count reached 0, so every writer of a row''s figures is covered without remembering to mark it
      (SL-063 review M2). Set anywhere else, a row can be marked before it settled, or a Done row whose figure
      moved can be published as final: the bug SL-063 fixed.'
    except_files:
    - src/FsAnalyser.Core/TopLevelTracker.cs
  - name: in the App only the row converter reads a top-level row's Revised flag
    files: src/FsAnalyser.App/**/*.cs
    must_not_match:
    - '\.Revised\b'
    because: 'TopLevelRowText is the one converter both the live results list and the ending''s list bind
      through (MainWindow.xaml, RowTitle). A second reader in the App, a copy of the suffix or the schema-1
      report, drifts from it, so a row can read as final in one place and revised in another; and the report
      is written only after the ending, with no per-row field and no names (Q-016), so wiring the flag in
      there without that work would be inert or wrong.'
    except_files:
    - src/FsAnalyser.App/TopLevelRowText.cs

  # settled by SL-065
  - name: no list or tree is placed directly inside a ScrollViewer in the main window
    files: src/FsAnalyser.App/MainWindow.xaml
    must_not_match:
    - '(?s)<ScrollViewer\b(?:"[^"]*"|''[^'']*''|[^>"''])*(?<!/)>(?:\s|<!--(?:(?!-->).)*-->|<ScrollViewer\.(\w+)\b[^>]*>(?:(?!</ScrollViewer\.\1>).)*</ScrollViewer\.\1>)*<(ListView|TreeView|ListBox|DataGrid)\b'
    because: A ScrollViewer measures its child with infinite height, which turns off virtualization.
      Spike 1 measured a ScrollViewer-hosted list realizing 100,001 containers, with a 229.7
      s expand and about 2 GB. Sections belong in a TabItem or a star row with a finite height.
      The pattern is deliberately narrow (direct child only) so it cannot fire on OutcomeTexts,
      which holds only TextBlocks. Between the two tags it skips whitespace, comments and ScrollViewer
      property elements (OutcomeTexts' own ScrollViewer.Style shape), reads quoted attribute values
      whole so a '>' inside one does not end the tag, and ignores a self-closing ScrollViewer. A
      skipped comment or property element ends at its own first closing tag and never runs on to
      a later one, so a commented ScrollViewer that holds no list stays quiet (plant row S13). It
      is multi-line, so plant rows S09-S12 prove the harness matches across newlines. If it matches
      per line, the rule can never fail and must be rewritten or dropped.

  # settled by SL-069
  - name: the rule-case suite never pins a literal parity count
    files: tests/rules/RuleCases.ps1
    must_not_match:
    - AGREE \d+ facts
    - <- \d+ twinned
    - \d+ patterns;
    - -ExpectFacts\s+['"]?\d
    - -ExpectFacts['"]?\s*,\s*['"]?\d
    - \bTwinned\s*=\s*\d
    - xunit \d+ Facts
    - found \d+ Facts where the test class has \d+
    - -(Facts|Twinned|Patterns)\s+\d
    - \b(Facts|Patterns)\s*=\s*\d
    because: 'A literal Facts/Twinned/Patterns count goes stale on the next slice that declares
      a twinned rule. That happened after SL-039, SL-042 and SL-043, and it turns every rule-copy
      case red or CANNOT-READ. The counts must come from the recount, and only an offset from
      it may be written. A literal in the C-005 mismatch case is worse: it silently turns into
      AGREE once the tree reaches that number.'
  - name: the SL-069 count tests never pin a literal parity count
    files: tests/bugs/SL-069-*.ps1
    must_not_match:
    - AGREE \d+ facts
    - <- \d+ twinned
    - \d+ patterns;
    - -ExpectFacts\s+['"]?\d
    - -ExpectFacts['"]?\s*,\s*['"]?\d
    - \bTwinned\s*=\s*\d
    - xunit \d+ Facts
    - found \d+ Facts where the test class has \d+
    - -(Facts|Twinned|Patterns)\s+\d
    - \b(Facts|Patterns)\s*=\s*\d
    because: 'The tests that hold RuleCases.ps1 to its derived counts run on scratch copies of this
      tree, so a count written into them goes stale on the next twinned slice exactly as the suite
      did. Each takes its expected line from the unchanged copy''s own line plus the change it
      made. Files takes one glob, so this is the same rule as the one above, for these files.'

  # settled by SL-082
  - name: the shipped App can never arm the listing failpoint itself
    files: src/FsAnalyser.App/**/*.cs
    must_not_match:
    - FSA_HOOK_FAIL_LISTING
    - FailListingOf\(
    because: the failpoint is a Core test seam, dormant like ScanOptions and SynchronousIoCancel
      already are; if product code read the arming variable or called the arming method directly,
      an ordinary user's environment could fake a directory failure the scanner never had, which
      breaks the 'no product-side flag' property spike 1 was framed around and this whole design
      rests on.

  # settled by SL-084
  # As its design declared them, then changed at build by the review findings the person accepted (m2, m3): each
  # excepts Kernel32.cs, where the constant is defined, and drops the lookahead that let any assignment through, so a
  # redefinition, a local, a named argument or an 'is 5 or 1920' elsewhere is caught. Neither has an xUnit twin;
  # comments are not matched. ReparsePointProbeTests' first-open Fact is what holds OpenForAttributes at flags 0.
  - name: only the 1920 retry opens a file without its filters
    files: src/FsAnalyser.Core/**/*.cs
    must_not_match:
    - \bFILE_(FLAG_)?OPEN_REPARSE_POINT\b
    - '\b(?:0x0*200000|2097152)[uU]?\b'
    because: The flag makes the open skip wof.sys, cldflt and dedup. Any open carrying it other
      than the 1920 retry would charge raw NTFS figures for WOF, deduplicated and cloud files.
      That is a counting defect that no size test on a plain temp tree notices. Kernel32.cs defines
      the constant and SynchronousIoCancel.OpenReparsePointForAttributes is the one open that passes
      it; nothing else in Core may name it or spell its value, in hex or decimal (review m2).
    except_files:
    - src/FsAnalyser.Core/Native/Kernel32.cs
    - src/FsAnalyser.Core/Scanning/SynchronousIoCancel.cs
  - name: a refused metadata open is decided in the probe, never filtered downstream
    files: src/**/*.cs
    must_not_match:
    - \bERROR_CANT_ACCESS_FILE\b
    - '\b(?:1920|0x0*780)\b'
    because: 'The fix is to size these files from their own handle. Special-casing 1920 in Scanner.Correct,
      ScanResult or MainWindow would make the repro pass while hiding the failure. The entry
      would be charged its unprobed listing figure (U-005, Q-004: the listing is not trusted
      for size), and a real 1920 the retry cannot open would disappear from ''could not be opened''.
      Kernel32.cs defines the constant and SizeProbe.Probe is the one place that branches on it; any
      other spelling, bare 1920 or 0x780 included, is refused, since ''is 5 or 1920'' is this code''s
      own idiom for a filter (review m3). No other code line in src holds either value.'
    except_files:
    - src/FsAnalyser.Core/Native/Kernel32.cs
    - src/FsAnalyser.Core/Scanning/SizeProbe.cs

  # settled by SL-087
  # Its design declared two rules here: 'the unreadable-folders view reads the scan result and never the filesystem'
  # and 'the App never fabricates a failed-folder record or decides its kind'. Its build twinned both instead, above
  # the first marker, as TheUnreadableViewTouchesNoFileSystem (*.cs) and TheAppNeverDecidesAFailedFolderKind (*.cs),
  # with (?m), including_comments: true and plants (F27-F30). The first gained the patterns its review added
  # (m4); the second lost the constructed-record pattern, which the compiler holds now that the record's constructor
  # is internal, and names the kinds as renamed (NothingListed for NotOpened, review M2 and M3).

  # settled by SL-088
  # Its design declared 'nothing in the app hands Explorer its select switch' here. Its build twinned it instead, above
  # the first marker, as NothingInTheAppHandsExplorerItsSelectSwitch (*.cs), with (?m), including_comments: true and
  # plants (F31-F35 must fire, P25-P27 must stay quiet), as the design's component asked. The pattern is the declared
  # one, unchanged. The second declared rule stays here, settled: the compiler holds it while the kind does not exist.
  - name: a reveal that cannot land never falls back to an ancestor
    files: src/**/*.cs
    must_not_match:
    - \bRevealKind\.Ancestor\b
    because: SL-088 deletes this kind to satisfy criterion 6. When a target's parent is deleted,
      the grandparent still parses S_OK (build-check probe), so SL-047's climb opened another
      folder in the target's place and called it success. Restoring the kind (for example by
      reverting to SL-047's Walk) brings that misroute back.

  # settled by SL-095
  - name: only ContainerLayerStore composes the container layer store path
    files: src/**/*.cs
    must_not_match:
    - (?i)containers(\\{1,2}|/{1,2}|"\s*,\s*")layers
    - '(?m)(?i:["\\/]Layers(?=["\\/]))'
    because: 'A second hand-written check of the store path reproduces the no-go the spike measured:
      a rule that is not root-aware skipped 3 of 3 subfolders when the user picked a root inside
      the store. A copy that skips the \\?\ strip or the separator boundary either walks the
      live layer again, leaking wcifs pool until a restart, or excludes a sibling folder the
      user wants counted. A store path built across calls (containers + @"\Layers\") is the same
      copy, so any Layers path segment in a literal counts.'
    except_files:
    - src/FsAnalyser.Core/Scanning/ContainerLayerStore.cs
  - name: the pool measurement never needs elevation
    files: tests/window/**
    must_not_match:
    - (?im)-Verb\s+['"]?RunAs\b
    - (?im)\bVerb\s*=\s*"runas"
    - (?im)^\s*(&\s*)?(Start-Process\s+(-FilePath\s+)?)?['"]?(poolmon|wpr|xperf|fltmc)(\.exe)?['"]?(\s|$)
    because: The protocol runs on a fresh boot the person had to restart for, and each layer
      entry touched leaks until the next restart. An elevation prompt, or a tool that fails
      unelevated, spoils that boot. That holds for every script and rig the protocol starts from tests/window,
      not only PoolWatch.ps1. The project decided on unelevated SystemPoolTagInformation marks,
      with fltmc output supplied separately by the person.

  # settled by SL-095
  - name: the container layer store path is composed in one place
    files: src/**/*.cs
    must_not_match:
    - (?m)(?i:Containers[\\/]{1,2}Layers)
    - (?m)(?i:"Layers")
    because: The store must be rebased onto the scan root's final spelling (subst, \\?\Volume{GUID},
      8.3) and compared separator-bounded without GetFullPath. A second composition anywhere
      else is a comparison that misses those roots or folds 'Layers.' into the store. The scan
      then walks the live layer, and wcifs.sys keeps the pool and a System handle per entry
      until restart.
    except_files:
    - src/FsAnalyser.Core/Scanning/ContainerLayerStore.cs
  - name: every directory open goes through the guarded call in DirectoryReader
    files: src/**/*.cs
    must_not_match:
    - (?m)\bSynchronousIoCancel\.OpenDirectory\s*\(
    because: The refuse-and-count backstop and the published opensUnderExcludedStore counter
      are evidence only if every directory open passes the rule check in DirectoryReader.Read.
      A second call site opens a layer folder with no check and no count. The wcifs leak comes
      back while the counter, which PoolWatch -Report's completeness check and the window
      report read, still reads 0.
    except_files:
    - src/FsAnalyser.Core/Scanning/DirectoryReader.cs
  - name: product code never switches the per-file metadata probe off
    files: src/**/*.cs
    must_not_match:
    - (?m)\bProbeRule\s*=(?![=>])
    because: SL-056 and Q-004 decided that every first-seen, non-link, non-cloud-only file is
      sized from its own handle, because listings go stale (a 257 MiB file listed at 0 B for
      15 s or more). The listing-only measurement arm that set it was deleted with ScanArm once
      O-003 was decided, and nothing outside ScanOptions sets it now. A ProbeRule assignment in
      product code brings stale sizes back into the totals.
    except_files:
    - src/FsAnalyser.Core/Scanning/ScanOptions.cs

  # settled by SL-095
  - name: the container layer store's location is spelled in one place
    files: src/**/*.cs
    must_not_match:
    - (?m)(?i:Containers[\\/]{1,2}Layers)
    - '(?m)(?i:"Containers"\s*,\s*"Layers")'
    because: 'Q-182 requires the refusal and the C: exclusion to match the store the same root-aware
      way. A second, string-only copy, such as an App pre-check or a second predicate in DirectoryReader,
      misses subst, junction, 8.3 and volume-GUID spellings and lets a scan walk the live layer,
      which leaks wcifs pool and a System handle per entry until a Restart.'
    except_files:
    - src/FsAnalyser.Core/Scanning/ContainerLayerStore.cs
  - name: the measurement rigs never relocate the store
    files: tests/window/**
    must_not_match:
    - ContainerLayerStorePath
    because: No rig has InternalsVisibleTo into Core now. The rule keeps any future rig, or the
      window hook, from setting the override, which would walk the live layer on the person's
      fresh boot and leak about 210K WC* entries and System handles until another Restart.
      Only Core.Tests may plant a fake store.
  - name: the App never relocates the store
    files: src/FsAnalyser.App/**
    must_not_match:
    - ContainerLayerStorePath
    because: An App-set or user-configurable store path bypasses the refusal decided in Q-179/Q-182
      and the exclusion decided in Q-180/Q-181. No correct App code mentions the override.

  # settled by SL-095
  - name: the container layer store's location is spelled in one file
    files: src/**
    must_not_match:
    - (?m)(?i:Containers[\\/]{1,2}Layers)
    - (?m)(?i:"Layers")
    because: 'Q-182 requires every spelling of the store (\\?\, subst, junction, 8.3, trailing
      separator) to be matched the same root-aware way. A second hard-coded copy, in notice
      text, the App or the scanner, matches by its own rules and drifts: a sibling named ''Layers.''
      gets skipped, or a subst spelling gets scanned and wcifs.sys leaks pool and System handles
      until a Restart.'
    except_files:
    - src/FsAnalyser.Core/Scanning/ContainerLayerStore.cs
  - name: the wcifs workaround is switched in exactly one place
    files: src/**
    must_not_match:
    - (?m)"wcifs-layer-store"
    - (?m)KnownWorkarounds\.WcifsLayerStore\b
    because: 'Turning the setting off must restore the plain scan exactly, and turning it on
      must guard every path. A second branch on this workaround in Scanner, DirectoryReader
      or the App is a condition the switch reaches separately: off could leave the store skipped
      on one path, or on could leave one open unguarded. The App renders the list generically
      and has no reason to name an entry.'
    except_files:
    - src/FsAnalyser.Core/Workarounds/KnownWorkarounds.cs
    - src/FsAnalyser.Core/Scanning/ContainerLayerStore.cs
  - name: the pool harness never elevates
    files: tests/window/PoolWatch*.ps1
    must_not_match:
    - (?m)-Verb\s+['"]?RunAs\b
    because: 'The stack decides that kernel-pool measurement runs unelevated, with fltmc pasted
      by the person. An elevated FsAnalyser.exe opens folders an ordinary user cannot, so its
      logs would measure a different scan from the one the app ships (constraint: never asks
      for admin).'
  - name: PoolWatch reports completeness, never a verdict
    files: tests/window/PoolWatch.ps1
    must_not_match:
    - (?m)["'][^"'\r\n]*\b(?:PASS|FAIL|VOID|OUTCOME)\b
    because: 'The narrowing moves every pool verdict to SC-128. Three review laps found a silent
      PASS on missing data in -Report''s verdict code (M1: logs with a crashed full scan read
      ''OUTCOME A / VERDICT PASS''). A verdict word printed by a harness that checks only completeness
      reads as DONE (c) met.'

